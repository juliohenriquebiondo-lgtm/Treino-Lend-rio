<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Acompanhamento de Treino Pro</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #202024;
      --border: #323238;
      --primary: #00b37e;
      --primary-hover: #00875f;
      --text: #e1e1e6;
      --text-muted: #8d8d99;
      --accent: #fba94c;
      --danger: #f75a68;
      --info: #35a7ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    header { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px; text-align: center; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    
    .nav-tabs { display: flex; background: var(--card-bg); border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab-btn { flex: 1; padding: 12px 14px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; -webkit-tap-highlight-color: transparent; transition: color 0.2s; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* Bloco de Citação Estoica (Muda a cada 1 min) */
    .stoic-box {
      background: linear-gradient(135deg, #1b2820 0%, #202024 100%);
      border: 1px solid #005f42;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--accent);
      animation: fadeIn 0.5s ease;
    }
    .stoic-box span {
      display: block;
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
      text-align: right;
    }

    /* Barra de Progresso */
    .progress-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .progress-bar-bg { width: 100%; height: 8px; background: #121214; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(0, 179, 126, 0.4);
    }

    .card { 
      background: var(--card-bg); 
      border-radius: 8px; 
      border: 1px solid var(--border); 
      padding: 16px; 
      margin-bottom: 16px; 
      transition: border-color 0.3s ease, background-color 0.3s ease;
    }
    .card.completed-card {
      border-color: rgba(0, 179, 126, 0.4);
      background: linear-gradient(180deg, #202024 0%, #16221d 100%);
    }

    .card-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; color: #fff; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; background: #29292e; color: var(--accent); margin-bottom: 8px; font-weight: 600; }
    .details { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; }

    .grid-row {
      display: grid;
      grid-template-columns: 24px 1fr 1fr 40px;
      gap: 6px;
      align-items: center;
      width: 100%;
    }
    .set-header { margin-bottom: 6px; }
    .set-row { margin-bottom: 6px; }
    .set-row input {
      width: 100%;
      min-width: 0;
      background: #121214;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      padding: 8px 4px;
      text-align: center;
      font-size: 15px;
      -webkit-appearance: none;
    }
    .set-row input:focus { border-color: var(--primary); outline: none; }
    .set-label { font-size: 0.8rem; color: var(--text-muted); text-align: center; font-weight: bold; }
    
    .check-btn {
      width: 100%;
      min-width: 0;
      background: #29292e;
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--text-muted);
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      transition: all 0.25s ease;
    }
    .check-btn.checked { 
      background: var(--primary); 
      border-color: var(--primary); 
      color: #fff; 
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(0, 179, 126, 0.5);
    }

    .note-input {
      width: 100%;
      background: #121214;
      border: 1px dashed var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.75rem;
      margin-bottom: 8px;
    }
    .note-input:focus { border-color: var(--accent); outline: none; }

    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid #29292e; }
    .rest-btn, .copy-btn { 
      background: transparent; 
      border: 1px solid var(--primary); 
      color: var(--primary); 
      padding: 5px 10px; 
      border-radius: 4px; 
      font-size: 0.75rem; 
      cursor: pointer; 
      transition: background 0.2s, color 0.2s; 
    }
    .copy-btn { border-color: var(--info); color: var(--info); margin-right: auto; margin-left: 8px; }
    .rest-btn:hover { background: var(--primary); color: #fff; }
    .copy-btn:hover { background: var(--info); color: #fff; }

    .info-box { background: #1b2820; border: 1px solid #005f42; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 0.85rem; line-height: 1.4; }

    /* Estilos da Aba de Calendário / Mês */
    .calendar-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); padding: 16px; margin-bottom: 16px; }
    .sub-nav { display: flex; gap: 8px; margin-bottom: 16px; }
    .sub-btn { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: #121214; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .sub-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    
    .day-selector-card { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .day-select-row { display: flex; justify-content: space-between; align-items: center; background: #121214; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); }
    .day-select-row select { background: #202024; color: #fff; border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; font-size: 0.85rem; max-width: 170px; }

    /* Grid do Mês */
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 10px; }
    .month-header-cell { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; padding-bottom: 4px; }
    .month-day-cell { 
      background: #121214; 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      padding: 6px 2px; 
      min-height: 58px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 0.75rem; 
    }
    .month-day-cell .day-num { font-weight: bold; color: var(--text-muted); font-size: 0.7rem; }
    .tag-badge { font-size: 0.55rem; padding: 1px 2px; border-radius: 3px; font-weight: bold; width: 100%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .badge-A { background: #005f42; color: #00b37e; }
    .badge-B { background: #1f3a5f; color: #35a7ff; }
    .badge-C { background: #5a3812; color: #fba94c; }
    .badge-Run { background: #5f1238; color: #f75a68; }
    .badge-Treadmill { background: #38125f; color: #c084fc; }
    .badge-Bike { background: #124c5f; color: #38bdf8; }
    .badge-Rest { background: #29292e; color: #8d8d99; }

    /* Ações Finais */
    .finish-section { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; margin-bottom: 40px; }
    .btn-export { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 6px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
    .btn-export:hover { background: var(--primary-hover); }
    .btn-reset { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
    .btn-reset:hover { border-color: var(--danger); color: var(--danger); }

    .timer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 2px solid var(--primary); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; animation: slideUp 0.3s ease; }
    .timer-display { font-size: 1.4rem; font-weight: bold; font-variant-numeric: tabular-nums; }
    .timer-controls button { background: var(--border); border: none; color: #fff; padding: 6px 12px; border-radius: 4px; margin-left: 6px; font-size: 0.85rem; cursor: pointer; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <h1>Acompanhamento de Treino Pro</h1>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn" data-tab="treinoA" onclick="switchTab('treinoA')">Treino A</button>
    <button class="tab-btn" data-tab="treinoB" onclick="switchTab('treinoB')">Treino B</button>
    <button class="tab-btn" data-tab="treinoC" onclick="switchTab('treinoC')">Treino C</button>
    <button class="tab-btn" data-tab="calendario" onclick="switchTab('calendario')">📅 Agenda & Mês</button>
  </nav>

  <div class="container" id="content"></div>

  <div class="timer-bar" id="timerBar" style="display: none;">
    <div>
      <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">Descanso</span>
      <span class="timer-display" id="timeRemaining">00:00</span>
    </div>
    <div class="timer-controls">
      <button onclick="addTime(30)">+30s</button>
      <button onclick="stopTimer()" style="background: var(--danger);">Parar</button>
    </div>
  </div>

  <script>
    const treinos = {
      treinoA: {
        titulo: "Treino A - Push (Peitoral, Ombros e Tríceps)",
        cardio: "25 a 30 min em Zona 2 (esteira inclinada 8%-12% a 5.0-5.8 km/h ou bike 70-80 RPM).",
        exercicios: [
          { id: "a1", nome: "1. Supino Inclinado com Halteres (30° a 45°)", series: 4, reps: "8-10", rest: 90, desc: "Cadência: 3s descida, 1s pausa embaixo, subida explosiva." },
          { id: "a2", nome: "2. Crucifixo / Crossover nas Polias Médias", series: 3, reps: "10-12", rest: 60, desc: "Polias na altura do peito/ombro; aperte 1s no pico de contração." },
          { id: "a3", nome: "3. Desenvolvimento com Halteres (ou Barra)", series: 3, reps: "8-10", rest: 90, desc: "Banco a 80°-85°. Amplitude completa até o queixo." },
          { id: "a4", nome: "4. Elevação Lateral na Polia Baixa (Unilateral)", series: 3, reps: "12-15", rest: 45, desc: "Cabo por trás ou pela frente. 45s de descanso entre lados." },
          { id: "a5", nome: "5. Tríceps Pulley com Barra Reta/V ou Corda", series: 3, reps: "10-12", rest: 60, desc: "Cotovelos fixos nas costelas, extensão total sem jogar ombros." },
          { id: "a6", nome: "6. Tríceps Francês Unilateral na Polia Baixa", series: 3, reps: "12-15", rest: 60, desc: "Braço na vertical, puxando o cabo por trás da cabeça." }
        ]
      },
      treinoB: {
        titulo: "Treino B - Pull (Costas, Deltóide Post. e Bíceps)",
        cardio: "25 a 30 min em Zona 2 (esteira inclinada 8%-12% a 5.0-5.8 km/h ou bike 70-80 RPM).",
        exercicios: [
          { id: "b1", nome: "1. Puxada Alta com Barra Longa (Pronada)", series: 4, reps: "8-10", rest: 90, desc: "Alongue bem a dorsal e puxe direcionando ao topo do esterno." },
          { id: "b2", nome: "2. Remada Baixa com Triângulo", series: 4, reps: "8-10", rest: 90, desc: "Puxe direcionando pelos cotovelos em direção ao abdômen." },
          { id: "b3", nome: "3. Remada Curvada com Barra Livre ou Halteres", series: 3, reps: "10-12", rest: 90, desc: "Tronco inclinado a 45°, puxe em direção ao umbigo." },
          { id: "b4", nome: "4. Face Pull na Polia Alta com Corda", series: 3, reps: "12-15", rest: 60, desc: "Puxe até a altura dos olhos abrindo e rodando ombros externamente." },
          { id: "b5", nome: "5. Rosca Bíceps na Polia Baixa (Barra Reta)", series: 3, reps: "10-12", rest: 60, desc: "Tensão constante, sem descansar no topo da contração." },
          { id: "b6", nome: "6. Rosca Martelo na Polia Baixa (Corda)", series: 3, reps: "12-15", rest: 60, desc: "Foco no braquial e braquiorradial." }
        ]
      },
      treinoC: {
        titulo: "Treino C - Legs & Abdômen",
        cardio: "15 a 20 min intensidade leve sem inclinação (recuperação ativa).",
        exercicios: [
          { id: "c1", nome: "1. Agachamento Livre com Barra ou Leg 45°", series: 4, reps: "8-10", rest: 120, desc: "Profundidade e estabilidade de core. 120s de descanso." },
          { id: "c2", nome: "2. Passada / Avanço com Halteres", series: 3, reps: "10-12", rest: 60, desc: "Tronco levemente inclinado à frente. 60-90s entre pernas." },
          { id: "c3", nome: "3. Elevação Pélvica (Barra ou Máquina)", series: 3, reps: "10-12", rest: 90, desc: "Bloqueio e contração máxima nos glúteos no ponto mais alto." },
          { id: "c4", nome: "4. Panturrilha em Pé (Máquina ou Degrau)", series: 4, reps: "15-20", rest: 45, desc: "2s de pausa embaixo no alongamento e 1s de pico no topo." },
          { id: "c5", nome: "5. Abdominal Crunch na Polia Alta", series: 3, reps: "15", rest: 60, desc: "Curvar a coluna usando o abdômen, sem puxar com os braços." }
        ]
      }
    };

    const stoicQuotes = [
      { text: "Nenhum homem é mais livre do que aquele que tem o poder sobre si mesmo.", author: "Sêneca" },
      { text: "A alma torna-se tingida com a cor dos seus pensamentos.", author: "Marco Aurélio" },
      { text: "Primeiro diga a si mesmo o que você gostaria de ser; depois faça o que tem a fazer.", author: "Epicteto" },
      { text: "Sofremos mais na imaginação do que na realidade.", author: "Sêneca" },
      { text: "Não espere pelas circunstâncias ideais, pois elas nunca chegam. Comece com o que tem.", author: "Platão" },
      { text: "A felicidade da sua vida depende da qualidade dos seus pensamentos.", author: "Marco Aurélio" },
      { text: "A dificuldade convida o homem a provar o seu valor.", author: "Epicteto" },
      { text: "Homens fortes não surgem de fáceis e confortáveis venturas; provações os forjam.", author: "Sêneca" }
    ];

    const activityOptions = [
      { value: "Descanso", label: "💤 Descanso", badge: "Desc", class: "badge-Rest" },
      { value: "Treino A", label: "💪 Treino A (Push)", badge: "Push", class: "badge-A" },
      { value: "Treino B", label: "🦾 Treino B (Pull)", badge: "Pull", class: "badge-B" },
      { value: "Treino C", label: "🦵 Treino C (Legs)", badge: "Legs", class: "badge-C" },
      { value: "Corrida Outdoor", label: "🏃 Corrida Outdoor", badge: "Run", class: "badge-Run" },
      { value: "Cardio Esteira", label: "🚶 Cardio Esteira", badge: "Esteira", class: "badge-Treadmill" },
      { value: "Cardio Bicicleta", label: "🚴 Cardio Bicicleta", badge: "Bike", class: "badge-Bike" }
    ];

    let activeTab = localStorage.getItem('activeTab') || 'treinoA';
    let calendarSubView = 'diario';
    let timerInterval = null;
    let timerSeconds = 0;

    let currentQuoteIndex = 0;
    function getRotatingQuote() {
      return stoicQuotes[currentQuoteIndex];
    }
    setInterval(() => {
      currentQuoteIndex = (currentQuoteIndex + 1) % stoicQuotes.length;
      const box = document.getElementById('stoicQuoteContainer');
      if (box) {
        const quote = stoicQuotes[currentQuoteIndex];
        box.innerHTML = `"${quote.text}"<span>— ${quote.author}</span>`;
      }
    }, 60000);

    function render() {
      const container = document.getElementById('content');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === activeTab);
      });

      if (activeTab === 'calendario') {
        renderCalendarTab(container);
        return;
      }

      const data = treinos[activeTab];
      const quote = getRotatingQuote();

      let totalSeries = 0;
      let completedSeries = 0;

      data.exercicios.forEach(ex => {
        totalSeries += ex.series;
        for (let i = 1; i <= ex.series; i++) {
          if (localStorage.getItem(`${ex.id}_c_${i}`) === 'true') {
            completedSeries++;
          }
        }
      });

      const percent = totalSeries > 0 ? Math.round((completedSeries / totalSeries) * 100) : 0;

      let html = `
        <div class="stoic-box" id="stoicQuoteContainer">
          "${quote.text}"
          <span>— ${quote.author}</span>
        </div>

        <div class="progress-box">
          <div class="progress-header">
            <span>Progresso do Treino</span>
            <span id="progressText">${completedSeries} / ${totalSeries} séries (${percent}%)</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill" style="width: ${percent}%;"></div>
          </div>
        </div>

        <div class="info-box">
          <strong>Diretrizes:</strong> Cadência 3s excêntrica. 1 a 2 repetições em reserva (RIR 1-2), indo até a falha técnica apenas na última série.<br><br>
          <strong>Cardio:</strong> ${data.cardio}
        </div>
      `;

      data.exercicios.forEach(ex => {
        let exCompletedCount = 0;
        for (let i = 1; i <= ex.series; i++) {
          if (localStorage.getItem(`${ex.id}_c_${i}`) === 'true') {
            exCompletedCount++;
          }
        }
        const isExFinished = exCompletedCount === ex.series;

        html += `
          <div class="card ${isExFinished ? 'completed-card' : ''}">
            <span class="badge">${ex.series} séries × ${ex.reps} reps</span>
            <div class="card-title">${ex.nome}</div>
            <div class="details">${ex.desc}</div>
            
            <div class="grid-row set-header">
              <span class="set-label">#</span>
              <span class="set-label">Kg</span>
              <span class="set-label">Reps</span>
              <span class="set-label">Ok</span>
            </div>
        `;

        for (let i = 1; i <= ex.series; i++) {
          const keyWeight = `${ex.id}_w_${i}`;
          const keyReps = `${ex.id}_r_${i}`;
          const keyCheck = `${ex.id}_c_${i}`;
          const keyNote = `${ex.id}_n_${i}`;

          const savedW = localStorage.getItem(keyWeight) || '';
          const savedR = localStorage.getItem(keyReps) || '';
          const savedN = localStorage.getItem(keyNote) || '';
          const isChecked = localStorage.getItem(keyCheck) === 'true';

          html += `
            <div class="grid-row set-row">
              <span class="set-label">${i}</span>
              <input type="number" inputmode="decimal" placeholder="kg" value="${savedW}" onchange="saveData('${keyWeight}', this.value)">
              <input type="number" inputmode="numeric" placeholder="reps" value="${savedR}" onchange="saveData('${keyReps}', this.value)">
              <button class="check-btn ${isChecked ? 'checked' : ''}" onclick="toggleCheck('${keyCheck}', ${ex.rest}, this)">✓</button>
            </div>
            <input type="text" class="note-input" placeholder="Nota da série (ex: falha na 8ª rep)..." value="${savedN}" onchange="saveData('${keyNote}', this.value)">
          `;
        }

        html += `
            <div class="card-actions">
              <span style="font-size: 0.8rem; color: var(--text-muted);">Descanso: ${ex.rest}s</span>
              <button class="copy-btn" onclick="copyPreviousSet('${ex.id}', ${ex.series})">Copiar Anterior</button>
              <button class="rest-btn" onclick="startTimer(${ex.rest})">Iniciar Descanso (${ex.rest}s)</button>
            </div>
          </div>
        `;
      });

      html += `
        <div class="finish-section">
          <button class="btn-export" onclick="exportWorkoutReport()">📥 Baixar Relatório do Treino (.txt)</button>
          <button class="btn-reset" onclick="resetCurrentTabChecks()">Limpar 'Checks' deste Treino</button>
        </div>
      `;

      container.innerHTML = html;
    }

    // Renderiza a 4ª aba com dois seletores independentes
    function renderCalendarTab(container) {
      const todayISO = new Date().toISOString().slice(0, 10);
      const selectedDate = localStorage.getItem('selectedCalendarDate') || todayISO;

      const act1 = localStorage.getItem(`day_act1_${selectedDate}`) || 'Descanso';
      const act2 = localStorage.getItem(`day_act2_${selectedDate}`) || '';

      let html = `
        <div class="calendar-container">
          <div class="sub-nav">
            <button class="sub-btn ${calendarSubView === 'diario' ? 'active' : ''}" onclick="setCalendarSubView('diario')">Registro Diário</button>
            <button class="sub-btn ${calendarSubView === 'mes' ? 'active' : ''}" onclick="setCalendarSubView('mes')">Visão Mensal</button>
          </div>
      `;

      if (calendarSubView === 'diario') {
        // Opções para a Atividade 1 (todas)
        let options1Html = '';
        activityOptions.forEach(opt => {
          options1Html += `<option value="${opt.value}" ${act1 === opt.value ? 'selected' : ''}>${opt.label}</option>`;
        });

        // Opções para a Atividade 2 (em branco + todas exceto a escolhida em act1)
        let options2Html = `<option value="" ${act2 === '' ? 'selected' : ''}>-- Nenhuma / Apenas 1 Atividade --</option>`;
        activityOptions.forEach(opt => {
          if (opt.value !== act1) {
            options2Html += `<option value="${opt.value}" ${act2 === opt.value ? 'selected' : ''}>${opt.label}</option>`;
          }
        });

        html += `
          <h3 style="font-size: 1rem; margin-bottom: 12px; color: #fff;">Registro de Atividade Diária</h3>
          <div class="day-selector-card">
            <div class="day-select-row">
              <span style="font-size: 0.85rem;">Escolha a Data:</span>
              <input type="date" value="${selectedDate}" onchange="localStorage.setItem('selectedCalendarDate', this.value); render();" style="background:#202024; color:#fff; border:1px solid var(--border); padding:6px; border-radius:4px;">
            </div>
            <div class="day-select-row">
              <span style="font-size: 0.85rem; font-weight: bold; color: var(--primary);">Atividade 1:</span>
              <select onchange="localStorage.setItem('day_act1_${selectedDate}', this.value); if(localStorage.getItem('day_act2_${selectedDate}') === this.value) { localStorage.setItem('day_act2_${selectedDate}', ''); } render();">
                ${options1Html}
              </select>
            </div>
            <div class="day-select-row">
              <span style="font-size: 0.85rem; font-weight: bold; color: var(--info);">Atividade 2 (Opcional):</span>
              <select onchange="localStorage.setItem('day_act2_${selectedDate}', this.value); render();">
                ${options2Html}
              </select>
            </div>
          </div>
          <p style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
            Você pode registrar uma única atividade ou combiná-las (ex: Treino A + Cardio Esteira). Tudo aparecerá perfeitamente na sua <strong>Visão Mensal</strong>.
          </p>
        `;
      } else {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const monthName = now.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
        
        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        html += `
          <h3 style="font-size: 1rem; margin-bottom: 4px; color: #fff; text-transform: capitalize;">${monthName}</h3>
          <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px;">Resumo mensal de treinos, cardios e descanso</p>
          
          <div class="month-grid">
            <div class="month-header-cell">Dom</div>
            <div class="month-header-cell">Seg</div>
            <div class="month-header-cell">Ter</div>
            <div class="month-header-cell">Qua</div>
            <div class="month-header-cell">Qui</div>
            <div class="month-header-cell">Sex</div>
            <div class="month-header-cell">Sáb</div>
        `;

        for (let i = 0; i < firstDayIndex; i++) {
          html += `<div class="month-day-cell" style="opacity: 0.2;"></div>`;
        }

        for (let d = 1; d <= totalDays; d++) {
          const dayStr = String(d).padStart(2, '0');
          const monthStr = String(month + 1).padStart(2, '0');
          const dateKey = `${year}-${monthStr}-${dayStr}`;
          
          const a1 = localStorage.getItem(`day_act1_${dateKey}`) || 'Descanso';
          const a2 = localStorage.getItem(`day_act2_${dateKey}`) || '';

          const opt1 = activityOptions.find(o => o.value === a1) || activityOptions[0];
          const opt2 = activityOptions.find(o => o.value === a2);

          html += `
            <div class="month-day-cell" onclick="localStorage.setItem('selectedCalendarDate', '${dateKey}'); calendarSubView='diario'; render();" style="cursor:pointer;">
              <span class="day-num">${d}</span>
              <div style="width:100%; display:flex; flex-direction:column; gap:2px;">
                <span class="tag-badge ${opt1.class}">${opt1.badge}</span>
                ${opt2 ? `<span class="tag-badge ${opt2.class}">${opt2.badge}</span>` : ''}
              </div>
            </div>
          `;
        }

        html += `</div>`;
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function setCalendarSubView(sub) {
      calendarSubView = sub;
      render();
    }

    function copyPreviousSet(exId, totalSeries) {
      for (let i = 2; i <= totalSeries; i++) {
        const prevW = localStorage.getItem(`${exId}_w_${i-1}`);
        const prevR = localStorage.getItem(`${exId}_r_${i-1}`);
        const currW = localStorage.getItem(`${exId}_w_${i}`);
        const currR = localStorage.getItem(`${exId}_r_${i}`);

        if ((!currW || !currR) && prevW) {
          if (prevW && !currW) localStorage.setItem(`${exId}_w_${i}`, prevW);
          if (prevR && !currR) localStorage.setItem(`${exId}_r_${i}`, prevR);
        }
      }
      render();
    }

    function switchTab(tab) {
      activeTab = tab;
      localStorage.setItem('activeTab', tab);
      render();
    }

    function saveData(key, val) {
      localStorage.setItem(key, val);
    }

    function toggleCheck(key, restTime, btn) {
      const current = localStorage.getItem(key) === 'true';
      const next = !current;
      localStorage.setItem(key, next);
      btn.classList.toggle('checked', next);
      render();
      if (next) startTimer(restTime);
    }

    function exportWorkoutReport() {
      const activeBtn = document.querySelector('.tab-btn.active');
      const currentTab = activeTab;
      if (currentTab === 'calendario') {
        alert("Selecione uma aba de treino (A, B ou C) para exportar o relatório do treino.");
        return;
      }
      
      const data = treinos[currentTab];
      if (!data) return;

      const now = new Date();
      const dateStr = now.toLocaleDateString('pt-BR');
      const timeStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      let report = `========================================\n`;
      report += `RELATÓRIO DE TREINO\n`;
      report += `${data.titulo}\n`;
      report += `Data: ${dateStr} às ${timeStr}\n`;
      report += `========================================\n\n`;

      data.exercicios.forEach(ex => {
        report += `EXERCÍCIO: ${ex.nome}\n`;
        let seriesCount = 0;

        for (let i = 1; i <= ex.series; i++) {
          const w = localStorage.getItem(`${ex.id}_w_${i}`) || '-';
          const r = localStorage.getItem(`${ex.id}_r_${i}`) || '-';
          const n = localStorage.getItem(`${ex.id}_n_${i}`) || '';
          const checked = localStorage.getItem(`${ex.id}_c_${i}`) === 'true';

          if (checked || w !== '-' || r !== '-' || n !== '') {
            seriesCount++;
            const status = checked ? '[CONCLUÍDO]' : '[NÃO MARCADO]';
            report += `  Série ${i}: ${w} kg × ${r} reps ${status}\n`;
            if (n) report += `    Obs: ${n}\n`;
          }
        }

        if (seriesCount === 0) {
          report += `  (Nenhuma série registrada)\n`;
        }
        report += `\n`;
      });

      report += `========================================\n`;
      report += `Cardio Recomendado: ${data.cardio}\n`;
      report += `========================================\n`;

      const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `treino_${currentTab.replace('treino', '')}_${now.toISOString().slice(0,10)}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    function resetCurrentTabChecks() {
      if (!confirm("Deseja desmarcar todos os 'checks' deste treino para o próximo dia? Suas cargas e notas continuarão salvas.")) {
        return;
      }
      const data = treinos[activeTab];
      if (!data) return;
      data.exercicios.forEach(ex => {
        for (let i = 1; i <= ex.series; i++) {
          localStorage.removeItem(`${ex.id}_c_${i}`);
        }
      });
      render();
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      timerSeconds = seconds;
      document.getElementById('timerBar').style.display = 'flex';
      updateTimerUI();

      timerInterval = setInterval(() => {
        timerSeconds--;
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          stopTimer();
        } else {
          updateTimerUI();
        }
      }, 1000);
    }

    function addTime(secs) {
      timerSeconds += secs;
      updateTimerUI();
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById('timerBar').style.display = 'none';
    }

    function updateTimerUI() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timeRemaining').innerText = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    render();
  </script>
</body>
</html>
